# No ADC connections for D1/D2/D3; only H2 VTEMP is connected on D0/D4/D5/D6.
# Legacy conversions and min/max limits are provisional; verify on Pathfinder.
adc_monitoring:
  adc:
    D0_VREF:
      pin: 5
      current: 0
      conv: 1.247
      min: 0.65
      max: 1.05
      flavor: small
      comment: D0 shared Vref; legacy conversion, verify on Pathfinder
      lpgbt: daq
      conversion_verified: false
    D0H1_VTEMP:
      pin: 2
      current: 0
      conv: 1
      min: 0
      max: 1.2
      flavor: small
      comment: D0H1 VTEMP voltage (not degrees C)
      lpgbt: daq
    D0_1V2_CURRENT:
      pin_pos: 0
      pin_neg: 1
      current: 0
      conv: 15.037
      min: 0.35
      max: 0.75
      flavor: small
      comment: D0 supply current H-L; legacy conversion, verify on Pathfinder
      differential: true
      lpgbt: trigger
      conversion_verified: false
    D4_VREF:
