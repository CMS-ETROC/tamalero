# Pathfinder wiring map: user-provided table, 2026-09-19.
# EDINgc -> software E-link = 4*g+c (confirmed by user).
# DnHm is a software identity, not the ETROC hardware chip_id.
# Reset/FC retain existing configuration. ADC monitoring is defined below.
# WS addresses added from the user-provided table, 2026-10-07.
# i2c.address is the ETROC address; i2c.ws_address is the WS address.
# Both devices share i2c.lpgbt and i2c.channel.
schema_version: 1
lpgbts:
  daq:
    hardware_id: 1
    elink_bank: 0
  trig:
    hardware_id: 2
    elink_bank: 1
    control:
      via: daq
      channel: 0
      address: 0x72
# TRIG control route above comes from the supplied get_trigger()/LPGBT code.
etrocs:
  D1H1:
    daughter: 1
    hybrid: 1
    motherboard_channel: 0
    connector: J401
    i2c:
      lpgbt: daq
      channel: 0
      address: 0x60
      ws_address: 0x40
    data:
      - lpgbt: daq
        pin: EDIN52
        dor_global: 1
    clock:
      lpgbt: trig
      pin: ECLK4
  D1H2:
    daughter: 1
    hybrid: 2
    motherboard_channel: 0
    connector: J401
    i2c:
