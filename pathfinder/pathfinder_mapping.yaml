# No ADC connections for D2/D3/D4; only H2 VTEMP is connected on D1/D5/D6/D7.
# Legacy conversions and min/max limits are provisional; verify on Pathfinder.
adc_monitoring:
  adc:
    D1_VREF:
      pin: 5
      current: 0
      conv: 1.247
      min: 0.65
      max: 1.05
      flavor: small
      comment: D1 shared Vref; legacy conversion, verify on Pathfinder
      lpgbt: daq
      conversion_verified: false
    D1H2_VTEMP:
      pin: 2
      current: 0
      conv: 1
      min: 0
      max: 1.2
      flavor: small
      comment: D1H2 VTEMP voltage (not degrees C)
      lpgbt: daq
    D1_1V2_CURRENT:
      pin_pos: 0
      pin_neg: 1
      current: 0
      conv: 15.037
      min: 0.35
      max: 0.75
      flavor: small
      comment: D1 supply current H-L; legacy conversion, verify on Pathfinder
      differential: true
      lpgbt: trigger
      conversion_verified: false
